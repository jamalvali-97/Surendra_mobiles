<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Surendra Mobiles & Electronics</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Arial,sans-serif;background:#f5f6f8;color:#171717}
button,a{font-family:inherit}
header{background:linear-gradient(135deg,#111,#252525);color:#fff;text-align:center;padding:25px 15px}
header h1{font-size:32px;margin-bottom:7px}
header p{color:#ddd}

.container{max-width:1100px;margin:auto;padding:20px 15px}
.section-title{text-align:center;font-size:29px;margin:25px 0 18px;font-weight:900}

.store-wrap{overflow:hidden;max-width:700px;margin:0 auto}
.store-slider{display:flex;transition:transform .45s ease}
.store-slide{min-width:100%;padding:5px}
.store-card{background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 7px 25px rgba(0,0,0,.13);text-align:center}
.store-card img{width:100%;height:300px;object-fit:cover;display:block}
.store-info{padding:20px}
.store-info h2{font-size:28px;font-weight:900;margin-bottom:12px}
.store-info p{font-size:18px;margin:8px 0}
.store-info a{color:#0066cc;text-decoration:none;font-weight:bold}
.dots{text-align:center;margin:14px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#bbb;margin:0 5px}
.dot.active{background:#111}

.categories{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}
.category{border:none;border-radius:18px;padding:25px 10px;color:#fff;cursor:pointer;min-height:135px;font-size:20px;font-weight:900;box-shadow:0 7px 20px rgba(0,0,0,.14);transition:.2s}
.category:hover{transform:translateY(-4px)}
.category span{display:block;font-size:42px;margin-bottom:10px}
.cat1{background:linear-gradient(135deg,#111,#444)}
.cat2{background:linear-gradient(135deg,#7b3f00,#d58b35)}
.cat3{background:linear-gradient(135deg,#164e63,#219ebc)}
.cat4{background:linear-gradient(135deg,#14532d,#22c55e)}

.page-section{display:none}
.page-section.active{display:block}
.back-home{background:#555;color:#fff;border:none;padding:11px 20px;border-radius:8px;font-weight:bold;cursor:pointer;margin-bottom:15px}

.products{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
.product-card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 6px 22px rgba(0,0,0,.12);text-align:center}
.product-name{font-size:30px;font-weight:1000;text-transform:uppercase;margin:5px 0 18px;letter-spacing:.5px}
.product-images{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.product-images img{width:100%;height:270px;object-fit:cover;border-radius:12px;background:#eee}
.product-price{font-size:26px;font-weight:900;margin:17px 0;color:#111}
.product-extra{font-size:20px;font-weight:bold;margin:12px 0}
.buy-btn,.video-btn,.whatsapp-btn{display:inline-block;border:none;text-decoration:none;color:#fff;padding:14px 25px;border-radius:9px;font-weight:bold;cursor:pointer;margin:6px}
.buy-btn{background:#008000;font-size:18px}
.video-btn{background:#e1306c}
.whatsapp-btn{background:#25d366}

.mobile-details{text-align:center;margin:14px 0}
.mobile-price{background:#f1f1f1;padding:12px;border-radius:10px;margin:7px 0;font-size:18px}
.contact{background:#111;color:#fff;text-align:center;padding:30px 15px;margin-top:30px}
.contact p{margin:8px 0}

.popup{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);justify-content:center;align-items:center;z-index:9999;padding:15px}
.popup-box{background:#fff;width:100%;max-width:470px;max-height:92vh;overflow-y:auto;border-radius:15px;padding:25px;position:relative}
.close-btn{position:absolute;right:15px;top:10px;border:none;background:none;font-size:25px;cursor:pointer}
.popup-box h2{text-align:center;margin-bottom:20px}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-weight:bold;margin-bottom:6px}
.form-group input,.form-group textarea{width:100%;padding:12px;border:1px solid #ccc;border-radius:7px;font-size:16px}
.form-group textarea{height:80px;resize:vertical}
.summary{background:#f1f1f1;padding:15px;border-radius:10px;line-height:1.8;margin-bottom:15px}
.continue-btn,.paid-btn{border:none;color:#fff;padding:14px;border-radius:8px;font-weight:bold;cursor:pointer;width:100%;margin:10px 0}
.continue-btn{background:#0666cc}.paid-btn{background:#008000}
.back-btn{background:#777;color:#fff;border:none;padding:12px 20px;border-radius:8px;cursor:pointer}
#paymentScreen,#successScreen{display:none;text-align:center}
.qr{width:250px;max-width:100%;display:block;margin:15px auto}
.payment-note{background:#fff3cd;padding:12px;border-radius:8px;margin:12px 0}
.order-summary{background:#f1f1f1;padding:15px;border-radius:10px;text-align:left;line-height:1.8;margin:15px 0}
.success-icon{font-size:60px}.success-title{color:#008000;margin-bottom:15px}

@media(max-width:750px){
 .categories{grid-template-columns:repeat(2,1fr)}
 .products{grid-template-columns:1fr}
 .product-images img{height:230px}
 .store-card img{height:240px}
}
@media(max-width:450px){
 header h1{font-size:27px}.section-title{font-size:25px}
 .category{min-height:120px;font-size:17px}.category span{font-size:35px}
 .product-name{font-size:25px}
}
</style>
</head>
